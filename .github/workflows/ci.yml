name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest "ruff>=0.6,<1"
      - name: Lint
        run: ruff check .
      - name: Generate the data and close every month (runs dbt build, verify and the formula check)
        run: python -m src.run_all
      - name: Test
        run: pytest -q
